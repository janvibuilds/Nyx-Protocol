name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-sequencer:
    name: Test Sequencer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: cd sequencer && npm install
      - name: Run tests
        run: cd sequencer && npm test

  test-worker:
    name: Test Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: cd worker && npm install
      - name: Run tests
        run: cd worker && npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test-sequencer, test-worker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build sequencer
        run: cd sequencer && npm install && npm run build
      - name: Build worker
        run: cd worker && npm install && npx tsc
      - name: Build CLI
        run: cd cli && npm install && npx tsc
