name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint sequencer
        run: cd sequencer && npm run lint

      - name: Lint worker
        run: cd worker && npm run lint

      - name: Lint cli
        run: cd cli && npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test sequencer
        run: cd sequencer && npm test

      - name: Test worker
        run: cd worker && npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build sequencer
        run: cd sequencer && npm run build

      - name: Build worker
        run: cd worker && npm run build

      - name: Build cli
        run: cd cli && npm run build

      - name: Build frontend
        run: cd frontend && npm run build

  contract:
    name: Compile Contracts
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile Compact contracts
        run: npx @midnight-ntwrk/compact compile contracts/*.compact -o contracts/dist
