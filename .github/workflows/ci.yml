name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: cd sequencer && npm ci && npm run lint
      - run: cd worker && npm ci
      - run: cd cli && npm ci

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run sequencer tests
        run: cd sequencer && npm ci && npm test
      - name: Run worker tests
        run: cd worker && npm ci && npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build sequencer
        run: cd sequencer && npm ci && npm run build
      - name: Build worker
        run: cd worker && npm ci && npx tsc
      - name: Build CLI
        run: cd cli && npm ci && npx tsc

  contract:
    name: Contract Compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Compile contract
        run: cd contracts && npm ci && npm run compile
      - name: Run contract tests
        run: cd contracts && npm test
